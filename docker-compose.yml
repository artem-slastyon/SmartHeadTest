name: smartheadtest

services:
  app:
    build:
      context: .
      dockerfile: docker/images/app/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      - db

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/logs/nginx/:/var/log/nginx
      - ./docker/configs/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:12.1.2
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  swagger:
    restart: unless-stopped
    image: docker.swagger.io/swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    environment:
      VALIDATOR_URL: "none"
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - "./docs/openai.yaml:/openapi.yaml"

volumes:
  mariadb_data:
